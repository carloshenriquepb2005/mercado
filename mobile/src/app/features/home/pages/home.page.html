<ion-header>
  <ion-toolbar class="app-toolbar">
    <ion-title>Precificação</ion-title>
    <button class="logout" slot="end" type="button" (click)="logout()" aria-label="Sair da conta">
      <ion-icon name="log-out-outline" />
    </button>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">
  <main class="home-shell">
    <section class="welcome">
      <h1>Olá, {{ session.user()?.displayName ?? 'Atendente' }}</h1>
      <button type="button" class="server-status" (click)="connectivity.check().subscribe()">
        <span [class.online]="connectivity.state() === 'online'"></span>
        {{ connectivity.state() === 'online' ? 'Servidor Online' : connectivity.state() === 'checking' ? 'Verificando servidor' : 'Servidor Offline' }}
      </button>
    </section>

    <section class="bento-grid" aria-label="Ações">
      <a class="action-card featured" routerLink="/scanner">
        <div class="icon-circle"><ion-icon name="pricetag-outline" /></div>
        <div><h2>Alterar Preço</h2><p>Inicie a alteração rápida de valores na gôndola.</p></div>
      </a>
      <a class="action-card compact" routerLink="/scanner">
        <div class="soft-icon"><ion-icon name="barcode-outline" /></div><strong>Consultar Produto</strong>
      </a>
      <button class="action-card compact" type="button" (click)="comingSoon('Promoções')">
        <div class="soft-icon orange"><ion-icon name="calculator-outline" /></div><strong>Promoções</strong>
      </button>
      <button class="action-card compact disabled-card" type="button" disabled>
        <div class="soft-icon muted"><ion-icon name="pricetag-outline" /></div><strong>Etiquetas</strong><small>Em breve</small>
      </button>
      <button class="action-card compact disabled-card" type="button" disabled>
        <div class="soft-icon muted"><span class="box-icon">□</span></div><strong>Inventário</strong><small>Em breve</small>
      </button>
      <button class="action-card settings" type="button" (click)="comingSoon('Configurações')">
        <div class="soft-icon muted"><ion-icon name="settings-outline" /></div>
        <div><strong>Configurações</strong><span>Dispositivo e conta</span></div>
      </button>
    </section>

    <section class="sync-card" aria-label="Status de sincronização">
      <div class="shelves" aria-hidden="true"><i></i><i></i><i></i></div>
      <p>{{ connectivity.state() === 'online' ? 'Sistema conectado à API local' : 'Aguardando conexão com a API local' }}</p>
    </section>
  </main>
  <app-bottom-navigation active="home" />
</ion-content>
