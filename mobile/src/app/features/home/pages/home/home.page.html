<app-header>
  <button class="logout" type="button" (click)="requestLogout()" aria-label="Sair da conta">
    <ion-icon name="log-out" />
  </button>
</app-header>

<ion-content class="page-content">
  <main class="home-shell">
    <section class="welcome">
      <h1>Olá, {{ session.user()?.displayName ?? 'Atendente' }}</h1>
      <app-connection-status [state]="connectivity.state()" [interactive]="true"
        (retry)="connectivity.check().subscribe()" />
    </section>

    <section class="bento-grid" aria-label="Ações">
      <app-home-action-card class="featured-card" title="Consulta de Estoque"
        description="Consulte código, descrição, preço, NCM e estoque atual."
        icon="barcode-outline" variant="featured" link="/scanner/consulta" />
      <app-home-action-card title="Alterar Preço" icon="pricetag-outline" link="/scanner/alteracao" />
      <app-home-action-card title="Promoções" icon="calculator-outline" tone="orange"
        (selected)="comingSoon('Promoções')" />
      <app-home-action-card title="Etiquetas" icon="pricetag-outline" tone="muted"
        badge="Em breve" [disabled]="true" />
      <app-home-action-card title="Inventário" icon="cube-outline" tone="muted"
        badge="Em breve" [disabled]="true" />
      <app-home-action-card class="settings-card" title="Configurações"
        description="Dispositivo e conta" icon="settings-outline" tone="muted" variant="wide"
        link="/ajustes" />
    </section>

  </main>
  <app-bottom-navigation active="home" />
</ion-content>

@if (logoutModalOpen()) {
  <div class="logout-backdrop" role="presentation" (click)="cancelLogout()">
    <section class="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logoutTitle"
      aria-describedby="logoutDescription" (click)="$event.stopPropagation()">
      <div class="logout-modal-icon" aria-hidden="true"><ion-icon name="log-out" /></div>
      <h2 id="logoutTitle">Sair do aplicativo?</h2>
      <p id="logoutDescription">Sua sessão será encerrada e será necessário entrar novamente.</p>
      <div class="logout-actions">
        <button class="cancel-logout" type="button" (click)="cancelLogout()">Cancelar</button>
        <button class="confirm-logout" type="button" (click)="confirmLogout()">Sair</button>
      </div>
    </section>
  </div>
}
