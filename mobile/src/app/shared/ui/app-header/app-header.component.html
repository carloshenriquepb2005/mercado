<ion-header>
  <ion-toolbar class="app-toolbar">
    @if (backHref(); as href) {
      <ion-buttons slot="start">
        <ion-back-button [defaultHref]="href" text="" />
      </ion-buttons>
    }
    <ion-title>
      @if (title(); as pageTitle) {
        {{ pageTitle }}
      } @else {
        <span class="brand-logo-frame">
          <img class="brand-logo" src="assets/texto_logo_sem_fundo.png" alt="SisBac" />
        </span>
      }
    </ion-title>
    <ion-buttons slot="end"><ng-content /></ion-buttons>
  </ion-toolbar>
</ion-header>
